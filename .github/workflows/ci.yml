name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # Native runners for both arches on both OSes — each leg builds and
        # tests its own GOARCH. The Windows legs natively compile the
        # //go:build windows smart-card code (bridge/host/winsign.go); Linux
        # exercises the stub. GitHub-hosted ARM labels: ubuntu-24.04-arm,
        # windows-11-arm.
        include:
          - { os: Linux, arch: amd64, runner: ubuntu-latest }
          - { os: Linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: Windows, arch: amd64, runner: windows-latest }
          - { os: Windows, arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files need 'gofmt -w':"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Cross-compile Windows bridge host
        # Guarantees the windows-only signing path keeps compiling even from a
        # Linux toolchain (pure Go over golang.org/x/sys/windows, no CGO).
        run: GOOS=windows GOARCH=amd64 go build ./bridge/host

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      # Run govulncheck directly rather than golang/govulncheck-action@v1.0.4,
      # which is stale (Node 20) and bundles an old actions/checkout that fails
      # with HTTP 400 on checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

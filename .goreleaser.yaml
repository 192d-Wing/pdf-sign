# GoReleaser configuration — https://goreleaser.com
# Local sanity check:  goreleaser check  &&  goreleaser release --snapshot --clean
version: 2

project_name: pdf-sign

before:
  hooks:
    - go mod download

builds:
  # Desktop / demo signing app.
  - id: pdf-sign
    main: ./cmd/pdf-sign
    binary: pdf-sign
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    goos: [linux, windows]
    goarch: [amd64, arm64]

  # Signing service (also shipped as a container image, see release.yml).
  - id: pdfsign-svc
    main: ./cmd/pdfsign-svc
    binary: pdfsign-svc
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    goos: [linux, windows]
    goarch: [amd64, arm64]

  # Native-messaging host — the smart-card signing path is Windows-only.
  - id: pdfsign-bridge
    main: ./bridge/host
    binary: pdfsign-bridge
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
    goos: [windows]
    goarch: [amd64, arm64]

archives:
  - id: pdf-sign
    ids: [pdf-sign]
    name_template: "pdf-sign_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: pdfsign-svc
    ids: [pdfsign-svc]
    name_template: "pdfsign-svc_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: pdfsign-bridge
    ids: [pdfsign-bridge]
    name_template: "pdfsign-bridge_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [zip]

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "Merge pull request"

release:
  draft: false
  prerelease: auto

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF approval &amp; signing</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1a1d21; --muted: #6b7280;
    --accent: #1f6feb; --ok: #147a3d; --err: #b42318; --border: #e3e6ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, "Segoe UI", sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1rem; color: var(--muted); text-transform: uppercase;
       letter-spacing: .05em; margin-top: 2rem; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: .9rem 1.1rem; margin: .6rem 0; display: flex; align-items: center;
    gap: 1rem; flex-wrap: wrap;
  }
  .card .name { font-weight: 600; flex: 1; min-width: 200px; }
  .card .status { font-size: .85rem; color: var(--muted); width: 100%; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: .5rem 1rem; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary { background: #fff; color: var(--accent);
    border: 1px solid var(--accent); }
  a { color: var(--accent); }
  .empty { color: var(--muted); font-style: italic; }
  .banner {
    background: #fff8e6; border: 1px solid #f0d58c; border-radius: 10px;
    padding: .7rem 1rem; font-size: .85rem; color: #7a5b00;
  }
  .banner.connected {
    background: #e9f7ee; border-color: #9fd8b4; color: #14572e;
  }
</style>
</head>
<body>
<main>
  <h1>Documents awaiting your signature</h1>
  <div class="banner" id="bridge-banner">Detecting signing bridge…</div>

  <h2>Pending approval</h2>
  <div id="pending"></div>

  <h2>Signed</h2>
  <div id="signed"></div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>

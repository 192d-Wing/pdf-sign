# SSL passthrough: mTLS terminates inside the pod, so the controller must
# NOT terminate TLS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pdfsign-svc
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: sign.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pdfsign-svc
                port:
                  number: 8443

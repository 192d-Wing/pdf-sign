# Traefik TCP route with TLS passthrough: SNI-based routing, the pod keeps
# terminating TLS so client-certificate (tenant) auth works.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: pdfsign-svc
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`sign.example.org`)
      services:
        - name: pdfsign-svc
          port: 8443
  tls:
    passthrough: true

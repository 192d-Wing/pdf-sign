# k3s with the bundled Traefik ingress (TLS passthrough via IngressRouteTCP).
#   kubectl apply -k deploy/kustomize/overlays/k3s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pdfsign

# Pins the image by digest — edit deploy/kustomize/image.yaml.
components:
  - ../../image

resources:
  - ../../base
  - ingressroutetcp.yaml

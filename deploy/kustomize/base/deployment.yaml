apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdfsign-svc
  # checkov:skip=CKV_K8S_43:Image is pinned by digest at deploy time (kustomize images.digest / CD), not in the runnable template.
spec:
  # Sessions are in-memory: keep 1 replica, or add sticky TCP routing
  # before scaling out.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pdfsign-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pdfsign-svc
    spec:
      # No pod needs the API server; don't mount a token into it.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # High, fixed UID/GID (matches the distroless "nonroot" user) to
        # avoid colliding with host users.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pdfsign-svc
          # Pin by tag AND digest in real deployments; the digest is what
          # image scanners require (kustomize `images:` can override).
          image: pdfsign-svc
          imagePullPolicy: Always
          args:
            - -addr
            - 0.0.0.0:8443
            - -max-sessions
            - "32"
            - -sign-ca
            - /etc/pdfsign/cas/sign-ca.pem
            - -client-ca
            - /etc/pdfsign/cas/client-ca.pem
            - -tls-cert
            - /etc/pdfsign/tls/tls.crt
            - -tls-key
            - /etc/pdfsign/tls/tls.key
          ports:
            - name: https
              containerPort: 8443
          # TCP probes: an HTTPS probe cannot pass the handshake because
          # the server requires client certificates.
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 5
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tls
              mountPath: /etc/pdfsign/tls
              readOnly: true
            - name: cas
              mountPath: /etc/pdfsign/cas
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: pdfsign-tls # kubernetes.io/tls: tls.crt, tls.key
        - name: cas
          secret:
            secretName: pdfsign-cas # Opaque: sign-ca.pem, client-ca.pem

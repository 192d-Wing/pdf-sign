apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Never deploy to the default namespace (overlays may override).
namespace: pdfsign

resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

# Dev/standalone default tag only. Real deployments go through an overlay,
# which pins the registry + digest via ../../image (single source of truth).
images:
  - name: pdfsign-svc
    newTag: "0.1.0"

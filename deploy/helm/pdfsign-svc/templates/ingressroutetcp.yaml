{{- if .Values.traefik.ingressRouteTCP.enabled }}
# Traefik (k3s default) TCP route with TLS passthrough: SNI-based routing,
# the pod keeps terminating TLS so client-certificate auth works.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "pdfsign-svc.fullname" . }}
  labels:
    {{- include "pdfsign-svc.labels" . | nindent 4 }}
spec:
  entryPoints:
    - {{ .Values.traefik.ingressRouteTCP.entryPoint }}
  routes:
    - match: HostSNI(`{{ .Values.traefik.ingressRouteTCP.host }}`)
      services:
        - name: {{ include "pdfsign-svc.fullname" . }}
          port: {{ .Values.service.port }}
  tls:
    passthrough: true
{{- end }}

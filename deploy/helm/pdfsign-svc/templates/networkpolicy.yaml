{{- if .Values.networkPolicy.enabled }}
# Boundary protection (NIST 800-53r5 SC-7): only allow ingress to the
# service port and egress to DNS + outbound TLS (TSA/OCSP).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pdfsign-svc.fullname" . }}
  labels:
    {{- include "pdfsign-svc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pdfsign-svc.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.listenPort }}
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
{{- end }}
